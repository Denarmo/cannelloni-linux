<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nonna's Kitchen - Cannelloni</title>
  <style>
    :root {
      --bg: #141414;
      --card-bg: #1e1e1e;
      --border: #333333;
      --accent: #f1c40f;
      --accent-hover: #d4ac0d;
      --text: #ffffff;
      --text-muted: #888888;
      --danger: #e74c3c;
      --success: #2ecc71;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 800px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.5rem; display: flex; align-items: center; gap: 10px; color: var(--accent); }
    .badge { background: #2a2a2a; color: var(--accent); padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; border: 1px solid #444; }
    
    .storage-bar-container { background: var(--card-bg); padding: 16px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border); }
    .storage-header { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 8px; color: var(--text-muted); }
    .progress-bar { height: 10px; background: #333; border-radius: 5px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s ease; }
    
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab { padding: 10px 20px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); cursor: pointer; font-weight: 600; font-size: 0.95rem; transition: all 0.2s; }
    .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
    
    .drop-zone { border: 2px dashed var(--border); border-radius: 8px; padding: 30px 20px; text-align: center; background: var(--card-bg); cursor: pointer; transition: all 0.2s; margin-bottom: 20px; }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: #252525; }
    .drop-icon { font-size: 2.5rem; margin-bottom: 10px; display: block; }
    .btn-select { background: var(--accent); color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; display: inline-block; margin-top: 10px; }
    
    .file-manager { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; }
    .breadcrumbs { padding: 12px 16px; background: #252525; border-bottom: 1px solid var(--border); font-size: 0.9rem; display: flex; gap: 6px; align-items: center; }
    .breadcrumbs a { color: var(--accent); text-decoration: none; cursor: pointer; }
    .file-list { list-style: none; max-height: 400px; overflow-y: auto; }
    .file-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .file-item:last-child { border-bottom: none; }
    .file-info { display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none; color: var(--text); flex-grow: 1; }
    .file-icon { font-size: 1.2rem; }
    .file-name { font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 450px; }
    .file-meta { font-size: 0.8rem; color: var(--text-muted); min-width: 80px; text-align: right; }
    .file-actions { display: flex; gap: 8px; }
    .btn-action { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
    .btn-action:hover { color: var(--text); background: #333; }
    .btn-delete:hover { color: var(--danger); }
    
    .status-msg { margin-bottom: 15px; font-size: 0.9rem; color: var(--accent); text-align: center; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🍳 Nonna's Kitchen</h1>
      <span class="badge">Cannelloni Web Manager</span>
    </header>

    <div class="storage-bar-container">
      <div class="storage-header">
        <span>SD Card Storage</span>
        <span id="storage-text">Loading...</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="storage-fill"></div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchCategory('Roms')">Roms</button>
      <button class="tab" onclick="switchCategory('Bios')">Bios</button>
      <button class="tab" onclick="switchCategory('Saves')">Saves</button>
    </div>

    <div class="drop-zone" id="drop-zone">
      <span class="drop-icon">📤</span>
      <p>Drag & Drop files here to upload</p>
      <span class="btn-select">Select Files</span>
      <input type="file" id="file-input" multiple style="display: none;">
    </div>

    <!-- Active Upload Progress Card -->
    <div id="upload-progress-container" class="storage-bar-container" style="display: none; margin-bottom: 20px; border-color: var(--accent);">
      <div class="storage-header">
        <span id="upload-filename" style="color: var(--accent); font-weight: 600;">Uploading...</span>
        <span id="upload-stats">0%</span>
      </div>
      <div class="progress-bar" style="height: 12px;">
        <div class="progress-fill" id="upload-progress-fill" style="background: var(--success); width: 0%;"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-top: 6px;">
        <span id="upload-speed">0 KB/s</span>
        <span id="upload-eta">-- remaining</span>
      </div>
    </div>

    <div id="upload-status" class="status-msg"></div>

    <div class="file-manager">
      <div class="breadcrumbs">
        <span>📍 /</span>
        <a onclick="navigateHome()" id="root-crumb">Roms</a>
        <span id="sub-crumb"></span>
        <span id="current-crumb" style="display:none;"></span>
      </div>
      <ul class="file-list" id="file-list">
        <li class="file-item"><span style="color: var(--text-muted);">Loading files...</span></li>
      </ul>
    </div>
  </div>

  <script>
    let currentDir = 'Roms';
    let baseDir = 'Roms';

    async function requestJson(url, options) {
      const res = await fetch(url, { cache: 'no-store', ...options });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    function switchCategory(cat) {
      baseDir = cat;
      currentDir = cat;
      document.querySelectorAll('.tab').forEach(t => {
        t.classList.toggle('active', t.innerText === cat);
      });
      document.getElementById('root-crumb').innerText = cat;
      document.getElementById('sub-crumb').innerText = '';
      loadDirectory(cat);
    }

    async function loadStorage() {
      try {
        const data = await requestJson('/cgi-bin/api.cgi?action=status');
        if (data.total) {
          document.getElementById('storage-text').innerText = `${data.used} used / ${data.free} free of ${data.total}`;
          const pct = Math.min(100, Math.max(0, data.percent));
          document.getElementById('storage-fill').style.width = pct + '%';
        }
      } catch (e) {
        document.getElementById('storage-text').innerText = 'Storage unavailable: ' + e.message;
      }
    }

    async function loadDirectory(path) {
      currentDir = path;
      const sub = path.startsWith(baseDir + '/') ? path.substring(baseDir.length) : (path === baseDir ? '' : ' / ' + path);
      document.getElementById('sub-crumb').innerText = sub ? ' / ' + sub.replace(/^\//, '') : '';
      const listEl = document.getElementById('file-list');
      listEl.innerHTML = '<li class="file-item"><span style="color: var(--text-muted);">Loading...</span></li>';
      try {
        const files = await requestJson(`/cgi-bin/api.cgi?action=list&dir=${encodeURIComponent(path)}`);
        if (path !== currentDir) return;
        listEl.innerHTML = '';
        if (files.length === 0) {
          listEl.innerHTML = '<li class="file-item"><span style="color: var(--text-muted);">Folder is empty</span></li>';
          return;
        }
        files.forEach(item => {
          const li = document.createElement('li');
          li.className = 'file-item';
          const isDir = item.type === 'dir';
          const icon = isDir ? '📁' : '📄';
          const fullPath = path ? `${path}/${item.name}` : item.name;
          const downloadUrl = `/cgi-bin/api.cgi?action=download&path=${encodeURIComponent(fullPath)}`;

          const infoDiv = document.createElement('div');
          infoDiv.className = 'file-info';
          if (isDir) {
            infoDiv.onclick = () => loadDirectory(fullPath);
          }

          const iconSpan = document.createElement('span');
          iconSpan.className = 'file-icon';
          iconSpan.textContent = icon;

          const nameSpan = document.createElement('span');
          nameSpan.className = 'file-name';
          nameSpan.title = item.name;
          nameSpan.textContent = item.name;

          infoDiv.appendChild(iconSpan);
          infoDiv.appendChild(nameSpan);

          const rightDiv = document.createElement('div');
          rightDiv.style.cssText = 'display: flex; align-items: center; gap: 14px;';

          const metaSpan = document.createElement('span');
          metaSpan.className = 'file-meta';
          metaSpan.textContent = isDir ? '' : item.size;
          rightDiv.appendChild(metaSpan);

          const actionsDiv = document.createElement('div');
          actionsDiv.className = 'file-actions';

          if (!isDir) {
            const dlLink = document.createElement('a');
            dlLink.href = downloadUrl;
            dlLink.setAttribute('download', item.name);
            dlLink.className = 'btn-action';
            dlLink.title = 'Download';
            dlLink.textContent = '⬇️';
            actionsDiv.appendChild(dlLink);
          }

          const delBtn = document.createElement('button');
          delBtn.className = 'btn-action btn-delete';
          delBtn.title = 'Delete';
          delBtn.textContent = '🗑️';
          delBtn.onclick = () => deleteFile(fullPath);
          actionsDiv.appendChild(delBtn);

          rightDiv.appendChild(actionsDiv);

          li.appendChild(infoDiv);
          li.appendChild(rightDiv);
          listEl.appendChild(li);
        });
      } catch (e) {
        if (path !== currentDir) return;
        listEl.innerHTML = '';
        const error = document.createElement('li');
        error.className = 'file-item';
        error.style.color = 'var(--danger)';
        error.textContent = 'Failed to load files: ' + e.message + '. Keep Nonna\'s Kitchen open on the device and refresh.';
        listEl.appendChild(error);
      }
    }

    function navigateHome() {
      loadDirectory(baseDir);
    }

    function refreshList() {
      loadDirectory(currentDir);
      loadStorage();
    }

    async function deleteFile(filePath) {
      if (!confirm(`Delete ${filePath}?`)) return;
      try {
        await requestJson(`/cgi-bin/api.cgi?action=delete&path=${encodeURIComponent(filePath)}`, { method: 'POST' });
        refreshList();
      } catch (e) {
        alert('Failed to delete file: ' + e.message);
      }
    }

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const uploadStatus = document.getElementById('upload-status');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) uploadFiles(fileInput.files);
    });

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
    }

    function formatTime(seconds) {
      if (!isFinite(seconds) || seconds < 0) return '--';
      if (seconds < 60) return Math.ceil(seconds) + 's';
      const m = Math.floor(seconds / 60);
      const s = Math.ceil(seconds % 60);
      return `${m}m ${s}s`;
    }

    function uploadSingleFile(file, dir, fileIndex, totalFiles) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        const startTime = Date.now();
        const progressContainer = document.getElementById('upload-progress-container');
        const progressFill = document.getElementById('upload-progress-fill');
        const filenameEl = document.getElementById('upload-filename');
        const statsEl = document.getElementById('upload-stats');
        const speedEl = document.getElementById('upload-speed');
        const etaEl = document.getElementById('upload-eta');

        progressContainer.style.display = 'block';
        filenameEl.innerText = `[${fileIndex + 1}/${totalFiles}] ${file.name}`;
        progressFill.style.width = '0%';
        statsEl.innerText = '0%';
        speedEl.innerText = 'Starting...';
        etaEl.innerText = '--';

        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable && e.total > 0) {
            const percent = ((e.loaded / e.total) * 100).toFixed(1);
            const elapsed = (Date.now() - startTime) / 1000;
            const speed = elapsed > 0 ? e.loaded / elapsed : 0;
            const remaining = speed > 0 ? (e.total - e.loaded) / speed : 0;
            progressFill.style.width = percent + '%';
            statsEl.innerText = `${percent}% (${formatBytes(e.loaded)} / ${formatBytes(e.total)})`;
            speedEl.innerText = `${formatBytes(speed)}/s`;
            etaEl.innerText = `${formatTime(remaining)} remaining`;
          }
        };

        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              const result = JSON.parse(xhr.responseText);
              if (result.error || result.status !== 'ok') throw new Error(result.error || 'Upload was not saved');
            } catch (e) {
              reject(e);
              return;
            }
            progressFill.style.width = '100%';
            statsEl.innerText = '100% (Complete)';
            speedEl.innerText = 'Transfer finished';
            etaEl.innerText = '0s';
            resolve(xhr.responseText);
          } else {
            reject(new Error(`Server returned status ${xhr.status}`));
          }
        };

        xhr.onerror = () => reject(new Error('Network error during upload'));
        xhr.onabort = () => reject(new Error('Upload aborted'));

        xhr.open('POST', `/cgi-bin/api.cgi?action=upload&dir=${encodeURIComponent(dir)}&name=${encodeURIComponent(file.name)}`, true);
        xhr.send(file);
      });
    }

    async function uploadFiles(files) {
      const progressContainer = document.getElementById('upload-progress-container');
      const uploadDir = currentDir;
      let failed = 0;
      uploadStatus.innerText = `Uploading ${files.length} file(s) to /${uploadDir}...`;
      for (let i = 0; i < files.length; i++) {
        try {
          await uploadSingleFile(files[i], uploadDir, i, files.length);
        } catch (e) {
          failed++;
          uploadStatus.innerText = `Error uploading ${files[i].name}: ${e.message}`;
          console.error(e);
        }
      }
      uploadStatus.innerText = failed ? `${failed} upload(s) failed. Please retry.` : 'All uploads complete!';
      refreshList();
      if (failed) return;
      setTimeout(() => {
        uploadStatus.innerText = '';
        progressContainer.style.display = 'none';
      }, 3500);
    }

    loadStorage();
    switchCategory('Roms');
  </script>
</body>
</html>
