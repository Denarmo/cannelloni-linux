name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version (e.g. 1.0.0); leave blank to use VERSION'
        required: false
      platform:
        description: 'Build all platforms to publish, or check one without publishing'
        type: choice
        required: false
        default: all
        options:
          - all
          - gkdpixel
          - m17
          - magicmini
          - miyoomini
          - my282
          - my355
          - rg35xx
          - rg35xxplus
          - rgb30
          - tg5040
          - trimuismart
          - zero28
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      matrix: ${{ steps.platforms.outputs.matrix }}
      full_matrix: ${{ steps.platforms.outputs.full_matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SDL dependencies for native regression tests
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-image-dev busybox-static
      - name: Validate semantic release version
        id: version
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: python scripts/release_version.py --github-output
      - name: Select validated platform matrix
        id: platforms
        env:
          TARGET_PLATFORM: ${{ github.event_name == 'push' && 'all' || inputs.platform || 'all' }}
        run: |
          python - <<'PY'
          import json
          import os

          runners = {
              "gkdpixel": "ubuntu-latest",
              "m17": "ubuntu-latest",
              "magicmini": "ubuntu-24.04-arm",
              "miyoomini": "ubuntu-latest",
              "my282": "ubuntu-latest",
              "my355": "ubuntu-24.04-arm",
              "rg35xx": "ubuntu-latest",
              "rg35xxplus": "ubuntu-latest",
              "rgb30": "ubuntu-latest",
              "tg5040": "ubuntu-24.04-arm",
              "trimuismart": "ubuntu-latest",
              "zero28": "ubuntu-24.04-arm",
          }
          target = os.environ["TARGET_PLATFORM"]
          if target != "all" and target not in runners:
              raise ValueError(f"Unknown platform: {target}")
          selected = runners if target == "all" else {target: runners[target]}
          matrix = {"include": [{"platform": p, "runner": r} for p, r in selected.items()]}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print("matrix=" + json.dumps(matrix, separators=(",", ":")), file=output)
              print("full_matrix=" + str(target == "all").lower(), file=output)
          PY
      - run: python -m unittest discover -s tests -v

  frontends:
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve upstream toolchain revision
        id: toolchain
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p toolchains
          git clone --depth 1 "https://github.com/shauninman/union-${PLATFORM}-toolchain/" "toolchains/${PLATFORM}-toolchain"
          revision=$(git -C "toolchains/${PLATFORM}-toolchain" rev-parse HEAD)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Restore compiled toolchain image
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/toolchain-image.tar.gz
          key: toolchain-v1-${{ matrix.platform }}-${{ matrix.runner }}-${{ steps.toolchain.outputs.revision }}-${{ hashFiles('makefile.toolchain', 'scripts/prepare_toolchain.py') }}
      - name: Load cached toolchain image
        if: steps.toolchain-cache.outputs.cache-hit == 'true'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          gzip -dc "$RUNNER_TEMP/toolchain-image.tar.gz" | docker load
          docker image inspect "${PLATFORM}-toolchain" > /dev/null
          touch "toolchains/${PLATFORM}-toolchain/.build"
      - name: Build and archive toolchain image
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          make -f makefile.toolchain PLATFORM="$PLATFORM" "toolchains/${PLATFORM}-toolchain/.build"
          docker image inspect "${PLATFORM}-toolchain" > /dev/null
          docker save "${PLATFORM}-toolchain" | gzip -1 > "$RUNNER_TEMP/toolchain-image.tar.gz"
      - name: Cache successful toolchain before compiling frontends
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/toolchain-image.tar.gz
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}
      - name: Compile current launcher, emulator frontend and DS core
        run: sh scripts/build_release_frontends.sh '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        with:
          name: frontends-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            workspace/all/cannelloni/build/${{ matrix.platform }}/cannelloni.elf
            workspace/all/minarch/build/${{ matrix.platform }}/minarch.elf
            workspace/all/say/build/${{ matrix.platform }}/say.elf
            workspace/${{ matrix.platform }}/cores/output/*_libretro.so
            workspace/${{ matrix.platform }}/cores/output/runtime/*.so*

  windows-installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --onefile --noconsole --add-data "VERSION;." --name Cannelloni-Installer installer/cannelloni_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/Cannelloni-Installer.exe
          if-no-files-found: error

  release:
    needs: [test, frontends, windows-installer]
    if: needs.test.outputs.full_matrix == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          pattern: frontends-*
          path: workspace
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - name: Build Release Archives
        env:
          RELEASE_VERSION: ${{ needs.test.outputs.version }}
        run: |
          python scripts/create_release_archives.py
          python scripts/verify_release_archive.py releases/Cannelloni-Installer.zip --built-workspace workspace

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_github_release.py --built-workspace workspace
