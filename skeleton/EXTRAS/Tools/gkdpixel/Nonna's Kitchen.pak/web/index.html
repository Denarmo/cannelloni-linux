<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nonna's Kitchen - Cannelloni</title>
  <style>
    :root {
      --bg: #141414;
      --card-bg: #1f1f1f;
      --card-hover: #292929;
      --accent: #f1c40f;
      --accent-hover: #d4ac0d;
      --text: #f0f0f0;
      --text-muted: #8e8e8e;
      --border: #333333;
      --danger: #e74c3c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 2px solid var(--border); margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon { font-size: 2.2rem; }
    h1 { font-size: 1.8rem; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
    .subtitle { font-size: 0.85rem; color: var(--text-muted); }
    .storage-bar-container { background: var(--card-bg); padding: 16px; border-radius: 10px; margin-bottom: 24px; border: 1px solid var(--border); }
    .storage-header { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 8px; color: var(--text-muted); }
    .progress-bar { height: 10px; background: #333; border-radius: 5px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }
    
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab { padding: 10px 20px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); cursor: pointer; font-weight: 600; font-size: 0.95rem; transition: all 0.2s; }
    .tab.active, .tab:hover { background: var(--accent); color: #000; border-color: var(--accent); }
    
    .drop-zone { border: 2px dashed var(--accent); border-radius: 12px; padding: 36px 20px; text-align: center; background: rgba(241, 196, 15, 0.03); margin-bottom: 24px; cursor: pointer; transition: all 0.2s; }
    .drop-zone.dragover { background: rgba(241, 196, 15, 0.12); border-color: #fff; }
    .drop-zone p { color: var(--text-muted); margin-top: 8px; font-size: 0.9rem; }
    .drop-zone .btn-select { display: inline-block; margin-top: 12px; padding: 8px 18px; background: var(--accent); color: #000; font-weight: 600; border-radius: 6px; font-size: 0.85rem; }

    .file-manager { background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border); overflow: hidden; }
    .file-manager-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: #181818; border-bottom: 1px solid var(--border); font-size: 0.9rem; font-weight: 600; }
    .breadcrumbs { display: flex; gap: 6px; color: var(--accent); }
    .breadcrumbs span { cursor: pointer; }
    .breadcrumbs span:hover { text-decoration: underline; }
    
    .file-list { list-style: none; max-height: 480px; overflow-y: auto; }
    .file-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--border); transition: background 0.15s; }
    .file-item:last-child { border-bottom: none; }
    .file-item:hover { background: var(--card-hover); }
    .file-info { display: flex; align-items: center; gap: 12px; cursor: pointer; overflow: hidden; }
    .file-icon { font-size: 1.2rem; }
    .file-name { font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 450px; }
    .file-meta { font-size: 0.8rem; color: var(--text-muted); min-width: 80px; text-align: right; }
    .file-actions { display: flex; gap: 8px; }
    .btn-action { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; }
    .btn-action:hover { color: var(--text); background: #333; }
    .btn-delete:hover { color: var(--danger); }
    
    .status-msg { margin-top: 12px; font-size: 0.85rem; color: var(--accent); text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <span class="brand-icon">🍝</span>
        <div>
          <h1>Nonna's Kitchen</h1>
          <div class="subtitle">Cannelloni Wireless Manager (Port 1091)</div>
        </div>
      </div>
      <div id="device-ip" style="font-size: 0.85rem; color: var(--accent); font-weight: 600;">Connected</div>
    </header>

    <div class="storage-bar-container">
      <div class="storage-header">
        <span>SD Card Storage</span>
        <span id="storage-text">Loading storage...</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="storage-fill"></div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-path="Roms">📁 ROMs</button>
      <button class="tab" data-path="Bios">⚙️ BIOS</button>
      <button class="tab" data-path="Saves">💾 Saves</button>
    </div>

    <div class="drop-zone" id="drop-zone">
      <div style="font-size: 2rem;">📤</div>
      <div style="font-weight: 600; font-size: 1.1rem; margin-top: 4px;">Drag & Drop ROMs or Files Here</div>
      <p>Files will be uploaded directly to the active folder</p>
      <span class="btn-select">Select Files</span>
      <input type="file" id="file-input" multiple style="display: none;">
    </div>
    <div id="upload-status" class="status-msg"></div>

    <div class="file-manager">
      <div class="file-manager-header">
        <div class="breadcrumbs" id="breadcrumbs">
          <span onclick="navigateHome()">Root</span> / <span id="current-crumb">Roms</span>
        </div>
        <button class="btn-action" onclick="refreshList()">🔄 Refresh</button>
      </div>
      <ul class="file-list" id="file-list">
        <li class="file-item"><span style="color: var(--text-muted);">Loading files...</span></li>
      </ul>
    </div>
  </div>

  <script>
    let currentDir = 'Roms';
    let baseDir = 'Roms';

    const tabs = document.querySelectorAll('.tab');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        baseDir = tab.dataset.path;
        currentDir = baseDir;
        loadDirectory(currentDir);
      });
    });

    async function loadStorage() {
      try {
        const res = await fetch('/cgi-bin/api.cgi?action=status');
        const data = await res.json();
        if (data.total) {
          document.getElementById('storage-text').innerText = `${data.used} used / ${data.free} free of ${data.total}`;
          const pct = Math.min(100, Math.max(0, data.percent));
          document.getElementById('storage-fill').style.width = pct + '%';
        }
      } catch (e) {
        document.getElementById('storage-text').innerText = 'Online';
      }
    }

    async function loadDirectory(path) {
      currentDir = path;
      document.getElementById('current-crumb').innerText = path;
      const listEl = document.getElementById('file-list');
      listEl.innerHTML = '<li class="file-item"><span style="color: var(--text-muted);">Loading...</span></li>';
      try {
        const res = await fetch(`/cgi-bin/api.cgi?action=list&dir=${encodeURIComponent(path)}`);
        const files = await res.json();
        listEl.innerHTML = '';
        if (files.length === 0) {
          listEl.innerHTML = '<li class="file-item"><span style="color: var(--text-muted);">Folder is empty</span></li>';
          return;
        }
        files.forEach(item => {
          const li = document.createElement('li');
          li.className = 'file-item';
          const isDir = item.type === 'dir';
          const icon = isDir ? '📁' : '📄';
          li.innerHTML = `
            <div class="file-info" onclick="${isDir ? `loadDirectory('${path}/${item.name}')` : ''}">
              <span class="file-icon">${icon}</span>
              <span class="file-name">${item.name}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 14px;">
              <span class="file-meta">${isDir ? '' : item.size}</span>
              <div class="file-actions">
                ${!isDir ? `<a href="/${path}/${item.name}" download class="btn-action">⬇️</a>` : ''}
                <button class="btn-action btn-delete" onclick="deleteFile('${path}/${item.name}')">🗑️</button>
              </div>
            </div>
          `;
          listEl.appendChild(li);
        });
      } catch (e) {
        listEl.innerHTML = '<li class="file-item"><span style="color: var(--danger);">Failed to load files</span></li>';
      }
    }

    function navigateHome() {
      loadDirectory(baseDir);
    }

    function refreshList() {
      loadDirectory(currentDir);
      loadStorage();
    }

    async function deleteFile(filePath) {
      if (!confirm(`Delete ${filePath}?`)) return;
      try {
        await fetch(`/cgi-bin/api.cgi?action=delete&path=${encodeURIComponent(filePath)}`, { method: 'POST' });
        refreshList();
      } catch (e) {
        alert('Failed to delete file');
      }
    }

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const uploadStatus = document.getElementById('upload-status');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) uploadFiles(fileInput.files);
    });

    async function uploadFiles(files) {
      uploadStatus.innerText = `Uploading ${files.length} file(s) to /${currentDir}...`;
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const formData = new FormData();
        formData.append('file', file);
        try {
          await fetch(`/cgi-bin/api.cgi?action=upload&dir=${encodeURIComponent(currentDir)}&name=${encodeURIComponent(file.name)}`, {
            method: 'POST',
            body: file
          });
          uploadStatus.innerText = `Uploaded (${i + 1}/${files.length}): ${file.name}`;
        } catch (e) {
          uploadStatus.innerText = `Error uploading ${file.name}`;
        }
      }
      uploadStatus.innerText = 'Upload complete!';
      refreshList();
      setTimeout(() => { uploadStatus.innerText = ''; }, 4000);
    }

    loadStorage();
    loadDirectory(currentDir);
  </script>
</body>
</html>
